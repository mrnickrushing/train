# Codemagic: build Ironhorse Frontier for iOS on a cloud Mac and ship it to TestFlight.
#
# Uses the team's shared settings (same as the other apps in this Codemagic team):
#   - variable group `ios_credentials`: APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER,
#     APP_STORE_CONNECT_ISSUER_ID (an App Store Connect API key with Admin or App Manager access)
#   - variable group `unity_credentials`: UNITY_EMAIL, UNITY_PASSWORD and, for Unity Plus/Pro, UNITY_SERIAL.
#     Without a serial the build signs in with the Unity ID (Unity Personal).
# Xcode signs automatically with the API key, creating the bundle id, certificate and profile
# itself. The App Store Connect app record (bundle id com.rushingtech.ironhorsefrontier) must
# exist for the TestFlight upload; the .ipa is kept as an artifact either way.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
        - unity_credentials
      vars:
        UNITY_VERSION: 6000.0.85f1
        UNITY_CHANGESET: ee7790f1426a
        UNITY_BIN: /Applications/Unity/Hub/Editor/6000.0.85f1/Unity.app/Contents/MacOS/Unity
        BUNDLE_ID: com.rushingtech.ironhorsefrontier
        APPLE_TEAM_ID: PH4AKDQ4Q7
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Check credentials
        script: |
          missing=""
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID UNITY_EMAIL UNITY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "Missing environment variables:$missing"; exit 1; fi
      - name: Install Unity editor with iOS support (if missing)
        script: |
          if [ ! -x "$UNITY_BIN" ]; then
            HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
            "$HUB" -- --headless install --version "$UNITY_VERSION" --changeset "$UNITY_CHANGESET" --module ios --childModules
          fi
          ls -la "$UNITY_BIN"
      - name: Activate Unity license
        script: |
          if [ -n "$UNITY_SERIAL" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          else
            # Unity Personal: sign in with the Unity ID.
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          fi
      - name: Run game-logic tests (EditMode)
        script: |
          "$UNITY_BIN" -batchmode -nographics -projectPath "$CM_BUILD_DIR" \
            -runTests -testPlatform EditMode -testResults "$CM_BUILD_DIR/test-results.xml" -logFile -
        test_report: test-results.xml
      - name: Export Xcode project from Unity
        script: |
          echo "Build number: $BUILD_NUMBER"   # Codemagic's per-workflow counter
          "$UNITY_BIN" -batchmode -quit -nographics -projectPath "$CM_BUILD_DIR" \
            -buildTarget iOS -executeMethod Ironhorse.EditorTools.BuildScript.BuildIos -logFile -
      - name: Archive and export signed .ipa
        script: |
          set -euo pipefail
          KEY="/tmp/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf "%b" "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath /tmp/Ironhorse.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic COMPILER_INDEX_STORE_ENABLE=NO \
            "${AUTH[@]}" archive
          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>destination</key><string>export</string>
            </dict>
          </plist>
          PLIST
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath /tmp/Ironhorse.xcarchive -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist "${AUTH[@]}"
    artifacts:
      - build/ios/ipa/*.ipa
      - test-results.xml
      - /tmp/Ironhorse.xcarchive/dSYMs/*.dSYM
    publishing:
      scripts:
        - name: Return Unity license
          script: |
            "$UNITY_BIN" -batchmode -quit -nographics -returnlicense \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile - || true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

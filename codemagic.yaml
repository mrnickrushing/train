# Codemagic: build Ironhorse Frontier for iOS on a cloud Mac and ship it to TestFlight.
#
# ios-testflight (default): the Xcode project is exported from Unity on the dev machine
#   (Tools/ios-export.sh, using the local Unity Personal license) and published as the
#   `ios-latest` GitHub release asset. This workflow downloads it, signs and uploads.
# ios-unity: runs Unity on the Mac itself; also needs `unity_credentials` (UNITY_EMAIL,
#   UNITY_PASSWORD, UNITY_SERIAL for Unity Plus/Pro).
#
# Both need a variable group `ios_credentials` with an App Store Connect API key (Admin role):
#   APP_STORE_CONNECT_PRIVATE_KEY   contents of AuthKey_XXXX.p8 (secure)
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_ISSUER_ID     (App Store Connect → Users and Access → Integrations)
# The archive is built unsigned; the export step signs it with an Apple cloud-managed distribution
# certificate and an App Store profile it creates on the fly (the key needs the Admin role), so no
# certificate or private key ever has to live on the build machine. Codemagic then uploads to
# TestFlight with the same key. The app record must exist in App Store Connect.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.rushingtech.ironhorsefrontier
        APPLE_TEAM_ID: PH4AKDQ4Q7
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        EXPORT_URL: https://github.com/mrnickrushing/train/releases/download/ios-latest/ios-xcode.zip
      xcode: latest
    scripts:
      - &check_asc
        name: Check App Store Connect key
        script: |
          missing=""
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "Missing in variable group ios_credentials:$missing"; exit 1; fi
      - name: Download the exported Xcode project
        script: |
          curl -fL --retry 3 -o /tmp/ios-xcode.zip "$EXPORT_URL"
          rm -rf ios && unzip -q /tmp/ios-xcode.zip -d .
          ls ios
      - &build_number
        name: Set build number
        script: |
          echo "Build number: $BUILD_NUMBER"   # Codemagic's per-workflow counter
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Info.plist
          # Only standard HTTPS: answers App Store Connect's export-compliance question up front.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Info.plist
      - &archive
        name: Archive and export signed .ipa
        script: |
          set -euo pipefail
          KEY="/tmp/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf "%b" "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath /tmp/Ironhorse.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${AUTH[@]}" archive > /tmp/xcodebuild_archive.log 2>&1 \
            || { grep -E "error:|error -|Error Domain|No profiles|No signing|requires a provisioning|failed" /tmp/xcodebuild_archive.log | sort -u | tail -40; echo "xcodebuild archive failed (full log in artifacts)"; exit 1; }
          tail -3 /tmp/xcodebuild_archive.log
          # The archive is unsigned, so it carries no entitlements and the export would drop them (Sign in
          # with Apple, Game Center). An ad-hoc signature stamps them on; export re-signs for the App Store
          # and keeps the entitlements the App Store profile allows.
          APP=$(ls -d /tmp/Ironhorse.xcarchive/Products/Applications/*.app)
          for f in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do [ -e "$f" ] && codesign --force --sign - "$f"; done
          plutil -convert xml1 -o /tmp/app.entitlements ios/Ironhorse.entitlements  # Unity writes <true />, which codesign's parser rejects
          codesign --force --sign - --entitlements /tmp/app.entitlements "$APP"
          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>destination</key><string>export</string>
            </dict>
          </plist>
          PLIST
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath /tmp/Ironhorse.xcarchive -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist "${AUTH[@]}" > /tmp/xcodebuild_export.log 2>&1 \
            || { grep -E "error|Error" /tmp/xcodebuild_export.log | tail -30; exit 1; }
          rm -rf /tmp/ipa && unzip -q -o build/ios/ipa/*.ipa -d /tmp/ipa
          echo "Signed entitlements:"; codesign -d --entitlements - --xml /tmp/ipa/Payload/*.app 2>/dev/null | plutil -p - || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/Ironhorse.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_*.log
    publishing:
      app_store_connect: &publish
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-check:
    name: iOS build check (signs, no TestFlight upload)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.rushingtech.ironhorsefrontier
        APPLE_TEAM_ID: PH4AKDQ4Q7
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        EXPORT_URL: https://github.com/mrnickrushing/train/releases/download/ios-latest/ios-xcode.zip
      xcode: latest
    scripts:
      - *check_asc
      - &download
        name: Download the exported Xcode project
        script: |
          curl -fL --retry 3 -o /tmp/ios-xcode.zip "$EXPORT_URL"
          rm -rf ios && unzip -q /tmp/ios-xcode.zip -d .
          ls ios
      - *build_number
      - *archive
    artifacts:
      - /tmp/xcodebuild_*.log

  ios-unity:
    name: iOS → TestFlight (Unity on the Mac; needs Unity Plus/Pro)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
        - unity_credentials
      vars:
        UNITY_VERSION: 6000.0.85f1
        UNITY_CHANGESET: ee7790f1426a
        UNITY_BIN: /Applications/Unity/Hub/Editor/6000.0.85f1/Unity.app/Contents/MacOS/Unity
        BUNDLE_ID: com.rushingtech.ironhorsefrontier
        APPLE_TEAM_ID: PH4AKDQ4Q7
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
      xcode: latest
      cocoapods: default
    scripts:
      - *check_asc
      - name: Check Unity credentials
        script: |
          missing=""
          for v in UNITY_EMAIL UNITY_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "Missing environment variables:$missing"; exit 1; fi
      - name: Install Unity editor with iOS support (if missing)
        script: |
          if [ ! -x "$UNITY_BIN" ]; then
            HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
            "$HUB" -- --headless install --version "$UNITY_VERSION" --changeset "$UNITY_CHANGESET" --module ios --childModules
          fi
          ls -la "$UNITY_BIN"
      - name: Activate Unity license
        script: |
          if [ -n "$UNITY_SERIAL" ]; then
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          else
            # Unity Personal: sign in with the Unity ID.
            "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
          fi
      - name: Run game-logic tests (EditMode)
        script: |
          "$UNITY_BIN" -batchmode -nographics -projectPath "$CM_BUILD_DIR" \
            -runTests -testPlatform EditMode -testResults "$CM_BUILD_DIR/test-results.xml" -logFile -
        test_report: test-results.xml
      - name: Export Xcode project from Unity
        script: |
          echo "Build number: $BUILD_NUMBER"   # Codemagic's per-workflow counter
          "$UNITY_BIN" -batchmode -quit -nographics -projectPath "$CM_BUILD_DIR" \
            -buildTarget iOS -executeMethod Ironhorse.EditorTools.BuildScript.BuildIos -logFile -
      - *build_number
      - *archive
    artifacts:
      - build/ios/ipa/*.ipa
      - test-results.xml
      - /tmp/Ironhorse.xcarchive/dSYMs/*.dSYM
    publishing:
      scripts:
        - name: Return Unity license
          script: |
            "$UNITY_BIN" -batchmode -quit -nographics -returnlicense \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile - || true
      app_store_connect: *publish

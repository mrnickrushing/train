# Codemagic: build Ironhorse Frontier for iOS on a cloud Mac and ship it to TestFlight.
#
# One-time setup in Codemagic (see README → "Building for iPhone with Codemagic"):
#   1. Add this repository as a Codemagic app (it picks up this file automatically).
#   2. Teams → Integrations → App Store Connect: add an API key and name it "Ironhorse ASC Key"
#      (or change the name under `integrations` below).
#   3. Environment variables → create a group named `unity_credentials` with:
#        UNITY_EMAIL, UNITY_PASSWORD  (your Unity ID)
#        UNITY_SERIAL                 (Unity Plus/Pro serial — Codemagic's Unity builds need a serial)
#   4. Set UNITY_VERSION / UNITY_CHANGESET below to the editor version you use locally
#      (both are shown on https://unity.com/releases/editor/archive).
#   5. Register the bundle id com.rushingtech.ironhorsefrontier in App Store Connect.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Ironhorse ASC Key
    environment:
      groups:
        - unity_credentials
      vars:
        UNITY_VERSION: 6000.0.23f1
        UNITY_CHANGESET: SET_ME  # e.g. from the Unity archive page for your exact version
        UNITY_BIN: /Applications/Unity/Hub/Editor/6000.0.23f1/Unity.app/Contents/MacOS/Unity
        BUNDLE_ID: com.rushingtech.ironhorsefrontier
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rushingtech.ironhorsefrontier
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Unity editor with iOS support (if missing)
        script: |
          if [ ! -x "$UNITY_BIN" ]; then
            HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
            "$HUB" -- --headless install --version "$UNITY_VERSION" --changeset "$UNITY_CHANGESET" --module ios --childModules
          fi
          ls -la "$UNITY_BIN"
      - name: Activate Unity license
        script: |
          "$UNITY_BIN" -batchmode -quit -nographics -logFile - \
            -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
      - name: Run game-logic tests (EditMode)
        script: |
          "$UNITY_BIN" -batchmode -nographics -projectPath "$CM_BUILD_DIR" \
            -runTests -testPlatform EditMode -testResults "$CM_BUILD_DIR/test-results.xml" -logFile -
        test_report: test-results.xml
      - name: Export Xcode project from Unity
        script: |
          export BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0) + 1))
          echo "Build number: $BUILD_NUMBER"
          "$UNITY_BIN" -batchmode -quit -nographics -projectPath "$CM_BUILD_DIR" \
            -buildTarget iOS -executeMethod Ironhorse.EditorTools.BuildScript.BuildIos -logFile -
      - name: Apply signing profiles
        script: xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build signed .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - test-results.xml
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      scripts:
        - name: Return Unity license
          script: |
            "$UNITY_BIN" -batchmode -quit -nographics -returnlicense \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -logFile - || true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  thetrail-testflight:
    # The Trail (mrnickrushing/thetrail) builds here because this app holds the App Store Connect
    # key (ios_credentials, team-wide). Downloads the thetrail export, not this repo's.
    name: The Trail iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.rushingtech.theogtrail
        APPLE_TEAM_ID: PH4AKDQ4Q7
        XCODE_PROJECT: ios/Unity-iPhone.xcodeproj
        XCODE_SCHEME: Unity-iPhone
        EXPORT_URL: https://github.com/mrnickrushing/thetrail/releases/download/ios-latest/ios-xcode.zip
      xcode: latest
    scripts:
      - name: Check App Store Connect key
        script: |
          missing=""
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_ISSUER_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "Missing in variable group ios_credentials:$missing"; exit 1; fi
      - name: Download the exported Xcode project
        script: |
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            # Private repository: resolve the asset through the API.
            ASSET=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/mrnickrushing/thetrail/releases/tags/ios-latest \
              | python3 -c "import sys,json; print([a['url'] for a in json.load(sys.stdin)['assets'] if a['name']=='ios-xcode.zip'][0])")
            curl -fL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream" -o /tmp/ios-xcode.zip "$ASSET"
          else
            curl -fL --retry 3 -o /tmp/ios-xcode.zip "$EXPORT_URL"
          fi
          rm -rf ios && unzip -q /tmp/ios-xcode.zip -d .
          ls ios
      - name: Set build number
        script: |
          echo "Build number: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Info.plist
      - name: Archive and export signed .ipa
        script: |
          set -euo pipefail
          KEY="/tmp/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          printf "%b" "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          chmod 600 "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY"
                -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID")
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath /tmp/TheTrail.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            "${AUTH[@]}" archive > /tmp/xcodebuild_archive.log 2>&1 \
            || { grep -E "error:|error -|Error Domain|No profiles|No signing|failed" /tmp/xcodebuild_archive.log | sort -u | tail -40; echo "xcodebuild archive failed (full log in artifacts)"; exit 1; }
          tail -3 /tmp/xcodebuild_archive.log
          cat > /tmp/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>${APPLE_TEAM_ID}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>destination</key><string>export</string>
            </dict>
          </plist>
          PLIST
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive -archivePath /tmp/TheTrail.xcarchive -exportPath build/ios/ipa \
            -exportOptionsPlist /tmp/export_options.plist "${AUTH[@]}" > /tmp/xcodebuild_export.log 2>&1 \
            || { grep -E "error|Error" /tmp/xcodebuild_export.log | tail -30; exit 1; }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/TheTrail.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

